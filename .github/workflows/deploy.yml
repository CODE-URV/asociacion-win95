name: Deploy a Hostinger

# Cada push a master compila la web y sube dist/ por FTP a public_html.
# Secrets necesarios (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    → hPanel → Archivos → Cuentas FTP → "Host FTP" (ej. ftp.tudominio.com o una IP)
#   FTP_USERNAME  → usuario FTP (ej. u123456789 o u123456789.tudominio.com)
#   FTP_PASSWORD  → contraseña FTP
# Variable opcional (pestaña "Variables"):
#   FTP_SERVER_DIR → carpeta destino en el servidor (por defecto public_html/)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Subir dist/ a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
